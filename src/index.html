<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Plataformas rítmico en 3D: salta al ritmo de la música.">
<title>Neon Dash 3D</title>
<link rel="icon" type="image/png" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  /* mínimo antes de que cargue el CSS (src/ui.css): fondo y pantalla de carga */
  html, body { margin: 0; height: 100%; background: #05040c; overflow: hidden; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #05040c; color: #27e3ff; font: 700 18px 'Chakra Petch', system-ui, sans-serif;
    letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 0 14px rgba(39, 227, 255, 0.7); transition: opacity 0.5s; z-index: 100; }
</style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4 L20 12 L7 20 Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-garage" viewBox="0 0 24 24"><path d="M12 2.5 L20.5 7.2 V16.8 L12 21.5 L3.5 16.8 V7.2 Z M3.5 7.2 L12 12 L20.5 7.2 M12 12 V21.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20 V16 L15.5 4.5 L19.5 8.5 L8 20 Z M13 7 L17 11"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><path d="M3.5 9 H20.5 V13 H3.5 Z M5 13 V20.5 H19 V13 M12 9 V20.5 M12 9 C9 9 6.5 4 9.5 4 C11 4 12 9 12 9 C12 9 13 4 14.5 4 C17.5 4 15 9 12 9"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8 V5.6 M12 18.4 V21.2 M2.8 12 H5.6 M18.4 12 H21.2 M5.5 5.5 L7.5 7.5 M16.5 16.5 L18.5 18.5 M5.5 18.5 L7.5 16.5 M16.5 7.5 L18.5 5.5"/><circle cx="12" cy="12" r="6.4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5 H10 V19 H7 Z M14 5 H17 V19 H14 Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8 L14.7 9 L21.2 9.4 L16.2 13.6 L17.8 20.2 L12 16.6 L6.2 20.2 L7.8 13.6 L2.8 9.4 L9.3 9 Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-diamond" viewBox="0 0 24 24"><path d="M12 2.5 L20.5 12 L12 21.5 L3.5 12 Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-orb" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9" stroke-width="1.6" opacity=".55"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><path d="M12 2.5 L20.2 7.2 V16.8 L12 21.5 L3.8 16.8 V7.2 Z" fill="currentColor" stroke="none"/><path d="M12 7.5 V16.5" stroke="#05040c" stroke-width="2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M5.5 11 H18.5 V20.5 H5.5 Z M8.5 11 V8 A3.5 3.5 0 0 1 15.5 8 V11"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3.5 H17 V9 A5 5 0 0 1 7 9 Z M7 5.5 H4 A3 3 0 0 0 7 10 M17 5.5 H20 A3 3 0 0 1 17 10 M12 14 V17.5 M8 20.5 H16 M9 17.5 H15"/></symbol>
  <symbol id="i-chest" viewBox="0 0 24 24"><path d="M3.5 10 H20.5 V20 H3.5 Z M3.5 10 A8.5 5.5 0 0 1 20.5 10 M10 12.5 H14 V15.5 H10 Z"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18 A2.3 2.3 0 1 1 6.7 15.7 A2.3 2.3 0 0 1 9 18 Z M9 18 V5.5 L19 3.5 V15.5 M19 15.5 A2.3 2.3 0 1 1 16.7 13.2 A2.3 2.3 0 0 1 19 15.5 Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M12 7 V12 L15.2 14"/></symbol>
  <symbol id="i-trail" viewBox="0 0 24 24"><path d="M3 18 C9 18 11 7 21 6.5 M3 13.5 C7 13.5 9 9.5 13 8"/></symbol>
  <symbol id="i-burst" viewBox="0 0 24 24"><path d="M12 2.5 V7 M12 17 V21.5 M2.5 12 H7 M17 12 H21.5 M5.3 5.3 L8.4 8.4 M15.6 15.6 L18.7 18.7 M5.3 18.7 L8.4 15.6 M15.6 8.4 L18.7 5.3"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.8 C15 7.5 18.2 10 18.2 14.4 A6.2 6.2 0 0 1 5.8 14.4 C5.8 11.3 8.3 9.5 9.5 7.2 C10.5 9 11 10 12.2 10.6 C12.5 8 12.3 5.3 12 2.8 Z"/></symbol>
  <symbol id="i-glow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="8.5" stroke-dasharray="2.5 3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 L10 18 L19.5 6.5"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.5 12 A7.5 7.5 0 1 0 7 6.4 M4.5 3.8 V8.8 H9.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8.5 6 H20 M8.5 12 H20 M8.5 18 H20 M4 6 H4.5 M4 12 H4.5 M4 18 H4.5"/></symbol>
  <symbol id="i-practice" viewBox="0 0 24 24"><path d="M12 2.5 L20.5 12 L12 21.5 L3.5 12 Z M12 8 L16 12 L12 16 L8 12 Z"/></symbol>
</svg>

<div id="app">
  <canvas id="view" tabindex="0" aria-label="Juego"></canvas>
  <div id="fade"></div>

  <section class="screen" id="menu">
    <div class="corner left"><div class="wallet" data-wallet></div></div>
    <div class="corner right">
      <button class="icon-btn" id="settingsBtn" aria-label="Ajustes"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
    <div class="title">
      <h1>Neon Dash<span>3D</span></h1>
      <p>Salta al ritmo de la música</p>
      <div class="menu-buttons">
        <button class="btn big glow" id="playBtn"><svg class="i"><use href="#i-play"/></svg> Jugar</button>
        <div class="row" style="margin-top:4px">
          <button class="btn purple" id="garageBtn"><svg class="i"><use href="#i-garage"/></svg> Garaje</button>
          <button class="btn orange" id="editorBtn"><svg class="i"><use href="#i-edit"/></svg> Crear</button>
          <button class="btn ghost" id="rewardsBtn"><svg class="i"><use href="#i-gift"/></svg> Premios</button>
        </div>
      </div>
    </div>
    <div class="hint">Saltar: <kbd>Espacio</kbd> <kbd>↑</kbd> <kbd>W</kbd> o clic / toque · Pausa: <kbd>Esc</kbd> · Reiniciar: <kbd>R</kbd></div>
  </section>

  <section class="screen" id="levels" hidden>
    <div class="corner left"><button class="icon-btn" id="levelsBack" aria-label="Volver"><svg class="i"><use href="#i-back"/></svg></button></div>
    <div class="level-nav">
      <button class="arrow" id="prevLevel" aria-label="Nivel anterior"><svg class="i"><use href="#i-back"/></svg></button>
      <div class="panel level-card">
        <div class="name" id="lvName"></div>
        <div class="badges"><span class="badge" id="lvDiff"></span><span class="badge time" id="lvTime" title="Duración del nivel"></span><span class="stars" id="lvStars"></span></div>
        <div class="modes" id="lvModes"></div>
        <div class="bars">
          <div class="bar"><span>Normal</span><div class="track"><div class="fill" id="lvBest"></div></div><span id="lvBestTxt"></span></div>
          <div class="bar practice"><span>Práctica</span><div class="track"><div class="fill" id="lvPrac"></div></div><span id="lvPracTxt"></span></div>
        </div>
        <div class="coins" id="lvCoins"></div>
        <div class="song-row"><span><svg class="i"><use href="#i-music"/></svg> <b id="lvSong">Original</b></span><button class="btn ghost small" id="lvSongBtn">Cambiar</button><button class="btn ghost small" id="lvSongReset" hidden>Original</button><input type="file" id="lvSongFile" accept="audio/*" hidden></div>
        <div class="row">
          <button class="btn glow" id="startLevel"><svg class="i"><use href="#i-play"/></svg> Jugar</button>
          <button class="btn purple" id="startPractice"><svg class="i"><use href="#i-practice"/></svg> Práctica</button>
        </div>
        <div class="dots" id="lvDots"></div>
      </div>
      <button class="arrow" id="nextLevel" aria-label="Nivel siguiente"><svg class="i"><use href="#i-next"/></svg></button>
    </div>
  </section>

  <section class="screen" id="hud" hidden>
    <div class="corner left"><button class="icon-btn" id="pauseBtn" aria-label="Pausa"><svg class="i"><use href="#i-pause"/></svg></button></div>
    <div class="top"><div class="track"><div class="fill" id="progress"></div></div><div class="pct" id="pct">0%</div></div>
    <div id="practiceTag" hidden>Práctica · <kbd>Z</kbd> marca · <kbd>X</kbd> quita</div>
    <div id="attempt"></div>
    <div id="newBest"></div>
  </section>

  <!-- Editor de niveles: lo construye src/editor.js -->
  <section class="screen" id="editor" hidden></section>

  <section class="screen garage-screen" id="garage" hidden>
    <div class="corner left"><button class="icon-btn" id="garageBack" aria-label="Volver"><svg class="i"><use href="#i-back"/></svg></button></div>
    <div class="panel garage">
      <div class="garage-head"><h2>Garaje</h2><span class="coin-count"><svg class="i"><use href="#i-coin"/></svg> <b id="garageCoins">0</b></span></div>
      <div class="tabs" id="garageTabs"></div>
      <div class="designs" id="garageList"></div>
      <div class="garage-colors"><span>Colores</span><div class="swatches" id="garagePalettes"></div></div>
      <p class="garage-msg" id="garageMsg"></p>
    </div>
  </section>

  <section class="screen dim" id="rewards" hidden>
    <div class="corner left"><button class="icon-btn" id="rewardsBack" aria-label="Volver"><svg class="i"><use href="#i-back"/></svg></button></div>
    <div class="panel rewards">
      <div class="garage-head"><h2>Premios</h2><div class="wallet" data-wallet></div></div>
      <div class="tabs" id="rwTabs"></div>
      <div class="rw-body" id="rwBody"></div>
    </div>
  </section>

  <section class="screen dim" id="pause" hidden>
    <div class="panel">
      <h2>Pausa</h2>
      <div class="settings" data-settings></div>
      <div class="row">
        <button class="btn" id="resumeBtn"><svg class="i"><use href="#i-play"/></svg> Seguir</button>
        <button class="btn orange" id="restartBtn"><svg class="i"><use href="#i-retry"/></svg> Reiniciar</button>
        <button class="btn ghost" id="quitBtn">Niveles</button>
      </div>
    </div>
  </section>

  <section class="screen dim" id="settings" hidden>
    <div class="panel">
      <h2>Ajustes</h2>
      <div class="settings" data-settings></div>
      <div class="row"><button class="btn" id="settingsClose">Listo</button></div>
    </div>
  </section>

  <section class="screen dim" id="complete" hidden>
    <div class="panel">
      <h2 id="doneTitle">¡Nivel completado!</h2>
      <div class="stats">
        <div class="stat"><b id="doneAttempts">1</b><span>Intentos</span></div>
        <div class="stat"><b id="doneJumps">0</b><span>Saltos</span></div>
        <div class="stat"><b id="doneTime">0:00</b><span>Tiempo</span></div>
        <div class="stat"><b id="doneCoins">0/0</b><span>Monedas</span></div>
      </div>
      <p class="done-reward" id="doneReward"></p>
      <div class="row">
        <button class="btn" id="doneNext">Siguiente <svg class="i"><use href="#i-next"/></svg></button>
        <button class="btn orange" id="doneRetry"><svg class="i"><use href="#i-retry"/></svg> Repetir</button>
        <button class="btn ghost" id="doneLevels"><svg class="i"><use href="#i-list"/></svg> Niveles</button>
      </div>
    </div>
  </section>

  <div id="toast"></div>
  <div id="loading">Cargando…</div>
</div>
<script>
  // Si el juego no arranca (un error al cargar), se avisa en vez de quedarse en negro.
  setTimeout(function () {
    var el = document.getElementById('loading');
    if (el && el.style.opacity !== '0') { el.className = 'err'; el.textContent = 'No se pudo cargar el juego. Prueba a recargar la página.'; }
  }, 15000);
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
